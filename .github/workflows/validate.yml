name: Validate source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read gorak release pin
        id: ecosystem
        run: python scripts/check_ecosystem.py --github-output "$GITHUB_OUTPUT"
        shell: bash
      - name: Check out tested gorak release
        uses: actions/checkout@v4
        with:
          repository: dougwhite/gorak
          ref: ${{ steps.ecosystem.outputs.gorak_revision }}
          path: .ci/gorak
      - name: Verify gorak release and source contract
        run: python scripts/check_ecosystem.py --checkout .ci/gorak
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: .ci/gorak/uv.lock
      - name: Install locked gorak dependencies
        run: uv sync --locked --project .ci/gorak
      - name: Reconstruct and round-trip demo source
        run: uv run --locked --project .ci/gorak python scripts/validate_source.py
